<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Nebula Survivor · 视觉目标 v1</title>
<style>
  :root{
    --ink-1000:#050607; --ink-900:#0A0B0D; --ink-800:#111316; --ink-700:#181B1F; --ink-600:#22262B; --ink-500:#2E3339;
    --fog-100:#E2E5E8; --fog-300:#8C949E; --fog-400:#6B7480;
    --amber-700:#8A6519; --amber-600:#A87C24; --amber-500:#D8A33C; --amber-400:#E9BE69; --amber-300:#F2D79B;
    --paper:#F2F4F5;
    --tier1:#F2F4F5; --tier2:#9CB86A; --tier3:#8FB3C9; --tier4:#D8A33C; --tier5:#C0503A;
    --signal-red:#C0503A;
    --glass:rgba(255,255,255,.03); --glassbd:rgba(255,255,255,.07);
    --mono: ui-monospace, "JetBrains Mono", "Cascadia Mono", Consolas, monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--ink-1000);color:var(--fog-100);
    font-family:"Segoe UI",system-ui,-apple-system,"Noto Sans SC",sans-serif;overflow:hidden}
  #stage{position:fixed;inset:0;overflow:hidden}
  canvas#space{position:absolute;inset:0;width:100%;height:100%}

  /* ---------- 底板层：网格 + 暗角 ---------- */
  #grid{position:absolute;inset:-10%;
    background-image:
      linear-gradient(to right, rgba(140,148,158,.05) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(140,148,158,.04) 1px, transparent 1px);
    background-size:72px 72px, 72px 72px; opacity:.9}
  #vignette{position:absolute;inset:0;
    background:radial-gradient(ellipse 78% 70% at 50% 46%, transparent 42%, rgba(0,0,0,.72) 100%)}

  /* ---------- 竞技场：有限边界 + 地形 ---------- */
  #arena{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:1180px;height:820px;border:1px solid rgba(216,163,60,.18);border-radius:26px;
    background:radial-gradient(ellipse 62% 58% at 50% 48%, rgba(216,163,60,.055), rgba(5,6,7,.30) 72%);
    box-shadow:inset 0 0 140px rgba(216,163,60,.05), 0 0 0 1px rgba(0,0,0,.6)}
  #arena::before,#arena::after{content:"";position:absolute;width:26px;height:26px;border:2px solid rgba(216,163,60,.5)}
  #arena::before{left:-1px;top:-1px;border-right:0;border-bottom:0;border-radius:26px 0 0 0}
  #arena::after{right:-1px;bottom:-1px;border-left:0;border-top:0;border-radius:0 0 26px 0}
  .terrain{position:absolute;background:linear-gradient(160deg,#171C22,#0D1116);
    border:1px solid rgba(140,148,158,.16);border-radius:10px;
    box-shadow:0 18px 34px -12px rgba(0,0,0,.85), inset 0 1px 0 rgba(233,190,105,.16)}
  .terrain::after{content:"";position:absolute;inset:8px;border-radius:6px;
    background:repeating-linear-gradient(115deg, rgba(255,255,255,.035) 0 2px, transparent 2px 11px)}
  .terrain.big{width:210px;height:104px;left:118px;top:96px;transform:rotate(-4deg)}
  .terrain.b2{width:150px;height:210px;right:132px;top:172px;transform:rotate(6deg)}
  .terrain.b3{width:250px;height:74px;left:392px;bottom:104px;transform:rotate(2deg)}
  .terrain.b4{width:96px;height:96px;left:246px;top:452px;border-radius:50%;transform:none}
  .lamp{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--amber-400);
    box-shadow:0 0 10px 2px rgba(233,190,105,.55)}

  /* ---------- 世界层 ---------- */
  #world{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .glow{filter:url(#soft)}

  /* ---------- HUD ---------- */
  .panel{position:absolute;background:rgba(24,27,31,.72);border:1px solid var(--glassbd);
    backdrop-filter:blur(14px);box-shadow:0 16px 48px -12px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.06)}
  .corners::before,.corners::after{content:"";position:absolute;width:9px;height:9px;border:1px solid rgba(216,163,60,.65)}
  .corners::before{left:-1px;top:-1px;border-right:0;border-bottom:0}
  .corners::after{right:-1px;bottom:-1px;border-left:0;border-top:0}
  .eyebrow{font:600 9px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--fog-400)}
  .data{font-family:var(--mono);font-variant-numeric:tabular-nums}

  #stats{position:absolute;left:18px;top:16px;width:226px;padding:11px 13px 10px;border-radius:12px}
  #stats .row{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}
  #stats .wave{font:700 13px/1 var(--mono);letter-spacing:.1em;color:var(--fog-100)}
  #stats .wave b{color:var(--amber-400)}
  .meter{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .meter span{font:600 9px/1 var(--mono);letter-spacing:.1em;color:var(--fog-400);width:16px;text-align:right}
  .bar{flex:1;height:7px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
  .bar i{display:block;height:100%;border-radius:99px}
  .hp i{width:74%;background:linear-gradient(90deg,#8A6519,#D8A33C 55%,#E9BE69)}
  .xp i{width:58%;background:linear-gradient(90deg,#5F7D42,#9CB86A)}
  .meter em{font:500 9px/1 var(--mono);color:var(--fog-400);font-style:normal;width:40px;text-align:right}
  #stats .kpi{display:flex;justify-content:space-between;border-top:1px solid rgba(255,255,255,.07);
    margin-top:9px;padding-top:8px;font:500 9.5px/1 var(--mono);color:var(--fog-400)}
  #stats .kpi b{color:var(--fog-100);font-weight:600}
  #stats .kpi .threat{color:#D98A72}

  #brand{position:absolute;left:50%;top:18px;transform:translateX(-50%);text-align:center}
  #brand .n{font:700 12px/1.1 "Segoe UI",sans-serif;letter-spacing:.16em;color:var(--fog-100)}
  #brand .z{font:500 9px/1.4 sans-serif;letter-spacing:.3em;color:var(--amber-500)}

  #sys{position:absolute;right:18px;top:16px;display:flex;gap:8px}
  .btn{height:30px;padding:0 12px;display:flex;align-items:center;gap:6px;border-radius:99px;
    border:1px solid rgba(255,255,255,.13);background:rgba(10,11,13,.55);backdrop-filter:blur(10px);
    font:500 11px/1 sans-serif;color:rgba(255,255,255,.82);white-space:nowrap}

  /* 雷达（游玩区内侧） */
  #radar{right:26px;top:74px;width:120px;height:120px;border-radius:50%;
    background:radial-gradient(circle, rgba(216,163,60,.05) 0%, rgba(5,6,7,.5) 70%);
    border:1px solid rgba(216,163,60,.22);position:absolute}
  #radar .ring{position:absolute;inset:22%;border:1px solid rgba(216,163,60,.13);border-radius:50%}
  #radar .ring2{position:absolute;inset:44%;border:1px solid rgba(216,163,60,.16);border-radius:50%}
  #radar .cross{position:absolute;left:50%;top:6%;bottom:6%;width:1px;background:rgba(216,163,60,.12)}
  #radar .cross.h{left:6%;right:6%;top:50%;bottom:auto;height:1px;width:auto}
  #radar .sweep{position:absolute;inset:0;border-radius:50%;
    background:conic-gradient(from 0deg, rgba(216,163,60,.30), transparent 26%, transparent 100%)}
  #radar .me{position:absolute;left:50%;top:50%;width:5px;height:5px;margin:-2.5px;border-radius:50%;background:var(--amber-300);box-shadow:0 0 8px 2px rgba(242,215,155,.6)}
  .blip{position:absolute;width:4px;height:4px;margin:-2px;border-radius:50%}

  /* 底部中央 武器槽 */
  #loadout{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);display:flex;gap:10px}
  .slot{position:relative;width:96px;padding:8px 9px;border-radius:10px;background:rgba(17,19,22,.82);
    border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(12px)}
  .slot .nm{font:600 10px/1 sans-serif;color:var(--fog-100);margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .slot .st{display:flex;gap:2px;margin-bottom:6px}
  .slot .st i{width:6px;height:6px;transform:rotate(45deg);background:currentColor;opacity:.95}
  .slot .st i.off{background:rgba(255,255,255,.16)}
  .slot .pips{display:flex;gap:3px;align-items:center}
  .slot .pips i{width:16px;height:3px;border-radius:2px;background:rgba(255,255,255,.14)}
  .slot .pips i.on{background:currentColor}
  .slot .pips em{font:500 8.5px/1 var(--mono);color:var(--fog-400);margin-left:3px;font-style:normal}
  .slot.empty{border-style:dashed;border-color:rgba(255,255,255,.14);background:rgba(10,11,13,.5);color:var(--fog-400)}
  .slot.empty .nm{color:var(--fog-400);font-weight:500}

  /* 右下 E 技环 */
  #skill{right:22px;bottom:22px;width:74px;height:74px;border-radius:50%;position:absolute;
    background:conic-gradient(var(--amber-500) 0 62%, rgba(255,255,255,.09) 62% 100%);
    display:flex;align-items:center;justify-content:center}
  #skill .inner{width:60px;height:60px;border-radius:50%;background:rgba(10,11,13,.92);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    border:1px solid rgba(216,163,60,.35)}
  #skill .inner .k{font:700 10px/1 var(--mono);color:var(--amber-300);letter-spacing:.08em}
  #skill .inner .cd{font:600 13px/1 var(--mono);color:var(--amber-400)}

  /* 左下摇杆（触屏） */
  #stick{left:26px;bottom:26px;width:132px;height:132px;border-radius:50%;position:absolute;opacity:.62;
    border:1px solid rgba(255,255,255,.12);background:radial-gradient(circle, rgba(216,163,60,.05), rgba(5,6,7,.28) 70%)}
  #stick .knob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px;border-radius:50%;
    background:radial-gradient(circle at 38% 34%, #E9BE69, #A87C24 70%, #6B4A10);
    box-shadow:0 0 22px rgba(216,163,60,.4), inset 0 1px 0 rgba(255,255,255,.35)}

  #hint{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);
    font:500 9.5px/1.5 var(--mono);color:rgba(255,255,255,.4);letter-spacing:.08em;text-align:center}

  /* 窄屏：HUD 自适应（真实 px，不缩放） */
  @media (max-width: 700px){
    #arena{width:900px;height:1180px}
    .terrain.big{left:80px;top:150px;width:170px;height:88px}
    .terrain.b2{right:60px;top:300px;width:130px;height:180px}
    .terrain.b3{left:150px;bottom:300px;width:210px;height:64px}
    .terrain.b4{left:120px;top:640px}
    #stats{width:198px;left:12px;top:58px;padding:9px 10px}
    #brand{top:12px}
    #brand .n{font-size:10px}
    #sys{right:12px;top:12px;gap:6px}
    .btn{padding:0 10px;font-size:10px;height:28px}
    #radar{right:12px;top:60px;width:92px;height:92px;opacity:.9}
    #loadout{bottom:16px;gap:7px}
    .slot{width:74px;padding:6px 7px}
    .slot .nm{font-size:9px}
    #skill{width:64px;height:64px;right:14px;bottom:18px}
    #skill .inner{width:52px;height:52px}
    #stick{width:118px;height:118px;left:18px;bottom:20px}
    #stick .knob{width:52px;height:52px;margin:-26px}
    #hint{display:none}
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="space"></canvas>
  <div id="grid"></div>
  <div id="vignette"></div>

  <div id="arena">
    <div class="terrain big"><span class="lamp" style="right:14px;bottom:12px"></span><span class="lamp" style="right:30px;bottom:12px;opacity:.5"></span></div>
    <div class="terrain b2"><span class="lamp" style="left:12px;top:14px"></span></div>
    <div class="terrain b3"><span class="lamp" style="left:18px;top:12px"></span><span class="lamp" style="left:36px;top:12px;opacity:.5"></span><span class="lamp" style="right:18px;top:12px"></span></div>
    <div class="terrain b4"><span class="lamp" style="left:50%;top:50%;margin:-3px"></span></div>
  </div>

  <svg id="world" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
    <defs>
      <filter id="soft" x="-120%" y="-120%" width="340%" height="340%">
        <feGaussianBlur stdDeviation="7"/>
      </filter>
      <radialGradient id="engineGlow"><stop offset="0" stop-color="#FFF6E2" stop-opacity=".95"/><stop offset=".45" stop-color="#E9BE69" stop-opacity=".5"/><stop offset="1" stop-color="#8A6519" stop-opacity="0"/></radialGradient>
      <linearGradient id="trail" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF6E2" stop-opacity=".75"/><stop offset=".45" stop-color="#E9BE69" stop-opacity=".30"/><stop offset="1" stop-color="#8A6519" stop-opacity="0"/></linearGradient>
      <radialGradient id="crystalGlow"><stop offset="0" stop-color="#FFF6E2" stop-opacity=".9"/><stop offset="1" stop-color="#D8A33C" stop-opacity="0"/></radialGradient>
    </defs>

    <!-- 弹幕 -->
    <g stroke-linecap="round">
      <line class="glow" x1="700" y1="392" x2="700" y2="360" stroke="#E9BE69" stroke-width="3"/>
      <line class="glow" x1="684" y1="404" x2="678" y2="376" stroke="#E9BE69" stroke-width="3"/>
      <line class="glow" x1="716" y1="404" x2="722" y2="376" stroke="#E9BE69" stroke-width="3"/>
      <line x1="612" y1="470" x2="640" y2="452" stroke="#C0503A" stroke-width="2.4"/>
      <line x1="836" y1="500" x2="812" y2="512" stroke="#C0503A" stroke-width="2.4"/>
    </g>

    <!-- 命中特效：冲击环 + 迸溅 -->
    <g>
      <circle cx="586" cy="322" r="30" fill="none" stroke="#E9BE69" stroke-width="2" opacity=".55"/>
      <circle cx="586" cy="322" r="46" fill="none" stroke="#E9BE69" stroke-width="1" opacity=".22"/>
      <g fill="#F2D79B">
        <circle cx="558" cy="300" r="2.4"/><circle cx="548" cy="330" r="1.8"/><circle cx="620" cy="336" r="2.1"/>
        <circle cx="632" cy="300" r="1.6"/><circle cx="596" cy="356" r="1.9"/>
      </g>
    </g>

    <!-- 伤害飘字（等宽，品牌琥珀） -->
    <text x="600" y="272" fill="#F2D79B" font-family="ui-monospace,Consolas,monospace" font-size="17" font-weight="700">128</text>
    <text x="386" y="556" fill="#F2D79B" font-family="ui-monospace,Consolas,monospace" font-size="14" font-weight="700" opacity=".75">64</text>

    <!-- 敌方：三档剪影（深描边 + 左上 rim light + 右下阴影） -->
    <g>
      <path d="M560 300 l26 -18 l26 18 l-9 34 l-34 0 z" fill="#C08069" stroke="#3A1A10" stroke-width="2" stroke-linejoin="round"/>
      <path d="M560 300 l26 -18 l26 18" fill="none" stroke="#E8CBB8" stroke-width="2"/>
      <circle cx="586" cy="308" r="5" fill="#E8CBB8" opacity=".85"/>
      <circle class="glow" cx="586" cy="316" r="16" fill="#C08069" opacity=".22"/>
    </g>
    <g>
      <path d="M902 258 l30 -16 l30 16 l0 30 l-30 16 l-30 -16 z" fill="#7FB39E" stroke="#1C3830" stroke-width="2" stroke-linejoin="round"/>
      <path d="M902 258 l30 -16 l30 16" fill="none" stroke="#CFE8DE" stroke-width="2"/>
      <rect x="922" y="272" width="20" height="6" fill="#CFE8DE" opacity=".5"/>
    </g>
    <g>
      <path d="M382 596 l24 -14 l34 0 l0 30 l-34 0 l-24 -14 z" fill="#C0503A" stroke="#40140C" stroke-width="2" stroke-linejoin="round"/>
      <path d="M382 596 l24 -14 l34 0" fill="none" stroke="#E0A99B" stroke-width="2"/>
      <rect x="404" y="596" width="22" height="4" fill="#E0A99B" opacity=".45"/>
      <circle class="glow" cx="440" cy="602" r="18" fill="#C0503A" opacity=".16"/>
    </g>

    <!-- 敌群：一波小怪（左右夹击，呼应雷达光点） -->
    <g>
      <path d="M1010 402 l20 -14 l20 14 l-7 24 l-26 0 z" fill="#C08069" stroke="#3A1A10" stroke-width="2" stroke-linejoin="round"/>
      <path d="M1010 402 l20 -14 l20 14" fill="none" stroke="#E8CBB8" stroke-width="1.8"/>
      <path d="M1058 470 l18 -12 l18 12 l-6 22 l-24 0 z" fill="#C08069" stroke="#3A1A10" stroke-width="2" stroke-linejoin="round"/>
      <path d="M1058 470 l18 -12 l18 12" fill="none" stroke="#E8CBB8" stroke-width="1.6"/>
      <path d="M300 336 l18 -12 l18 12 l-6 22 l-24 0 z" fill="#C08069" stroke="#3A1A10" stroke-width="2" stroke-linejoin="round"/>
      <path d="M300 336 l18 -12 l18 12" fill="none" stroke="#E8CBB8" stroke-width="1.6"/>
      <path d="M470 700 l22 -15 l22 15 l-8 26 l-28 0 z" fill="#7FB39E" stroke="#1C3830" stroke-width="2" stroke-linejoin="round"/>
      <path d="M470 700 l22 -15 l22 15" fill="none" stroke="#CFE8DE" stroke-width="1.8"/>
    </g>
    <!-- 炮口闪光 -->
    <g class="glow" opacity=".9">
      <circle cx="700" cy="392" r="9" fill="#FFF6E2" opacity=".9"/>
      <circle cx="700" cy="392" r="20" fill="#E9BE69" opacity=".30"/>
    </g>

    <!-- 掉落：琥珀结晶 -->
    <g>
      <circle class="glow" cx="756" cy="646" r="22" fill="url(#crystalGlow)"/>
      <path d="M756 630 l11 16 l-11 16 l-11 -16 z" fill="#D8A33C" stroke="#8A6519" stroke-width="1.5"/>
      <path d="M756 630 l11 16 l-11 4 z" fill="#F2D79B"/>
    </g>

    <!-- 玩家舰：多层矢量（船体/机翼/座舱/引擎）+ 尾迹 -->
    <g transform="translate(700,436)">
      <ellipse cx="0" cy="44" rx="13" ry="34" fill="url(#trail)" opacity=".75"/>
      <circle class="glow" cx="-7" cy="26" r="13" fill="url(#engineGlow)"/>
      <circle class="glow" cx="7" cy="26" r="13" fill="url(#engineGlow)"/>
      <!-- 机翼 -->
      <path d="M-9 4 L-34 22 L-32 30 L-9 18 Z" fill="#171C22" stroke="#05070A" stroke-width="2" stroke-linejoin="round"/>
      <path d="M9 4 L34 22 L32 30 L9 18 Z" fill="#171C22" stroke="#05070A" stroke-width="2" stroke-linejoin="round"/>
      <path d="M-9 4 L-34 22 L-32 30 L-9 18 Z" fill="none" stroke="#E9BE69" stroke-width="1.2" opacity=".35"/>
      <path d="M9 4 L34 22 L32 30 L9 18 Z" fill="none" stroke="#E9BE69" stroke-width="1.2" opacity=".2"/>
      <!-- 船体 -->
      <path d="M0 -30 L11 -4 L10 20 L6 30 L-6 30 L-10 20 L-11 -4 Z" fill="#2A3138" stroke="#05070A" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="M0 -30 L11 -4 L0 -8 L-11 -4 Z" fill="#4A545E"/>
      <path d="M0 -30 L11 -4 L10 20 L6 30 L0 30 Z" fill="#10141A" opacity=".55"/>
      <!-- 座舱 -->
      <path d="M0 -14 L5 -3 L0 6 L-5 -3 Z" fill="#D8A33C" stroke="#8A6519" stroke-width="1.2"/>
      <path d="M0 -14 L5 -3 L0 -3 Z" fill="#FFF6E2"/>
      <!-- 炮口 -->
      <path d="M0 -30 L0 -40" stroke="#E9BE69" stroke-width="2.6" stroke-linecap="round"/>
    </g>
  </svg>

  <!-- HUD -->
  <div id="brand"><div class="n">NEBULA SURVIVOR</div><div class="z">星 域 突 围</div></div>
  <div id="sys"><div class="btn">◔ 音效</div><div class="btn">暂停</div><div class="btn">规则</div></div>

  <div id="stats" class="panel corners">
    <div class="row"><span class="wave">WAVE <b>03</b></span><span class="eyebrow">LV <b class="data" style="color:var(--fog-100)">07</b></span></div>
    <div class="meter"><span>HP</span><div class="bar hp"><i></i></div><em>61/82</em></div>
    <div class="meter"><span>XP</span><div class="bar xp"><i></i></div><em>19/32</em></div>
    <div class="kpi"><span>击杀 <b>128</b></span><span>得分 <b style="color:var(--amber-400)">1460</b></span><span class="threat">威胁 中</span></div>
  </div>

  <div id="radar">
    <div class="ring"></div><div class="ring2"></div>
    <div class="cross"></div><div class="cross h"></div>
    <div class="sweep" style="transform:rotate(-38deg)"></div>
    <div class="me"></div>
    <span class="blip" style="left:74%;top:34%;background:#C08069;box-shadow:0 0 6px #C08069"></span>
    <span class="blip" style="left:26%;top:62%;background:#7FB39E;box-shadow:0 0 6px #7FB39E"></span>
    <span class="blip" style="left:60%;top:76%;background:#C08069;box-shadow:0 0 6px #C08069"></span>
    <span class="blip" style="left:18%;top:24%;background:#C0503A;box-shadow:0 0 7px #C0503A"></span>
  </div>

  <div id="loadout">
    <div class="slot" style="color:var(--tier4);border-color:rgba(216,163,60,.7);box-shadow:0 0 18px rgba(216,163,60,.25)">
      <div class="nm">穿透狙击</div>
      <div class="st"><i></i><i></i><i></i><i class="off"></i><i class="off"></i></div>
      <div class="pips"><i class="on"></i><i class="on"></i><i></i><em>2/3</em></div>
    </div>
    <div class="slot" style="color:var(--tier3);border-color:rgba(143,179,201,.55);box-shadow:inset 0 0 12px rgba(143,179,201,.18)">
      <div class="nm">散射炮</div>
      <div class="st"><i></i><i></i><i class="off"></i><i class="off"></i><i class="off"></i></div>
      <div class="pips"><i class="on"></i><i></i><i></i><em>1/3</em></div>
    </div>
    <div class="slot" style="color:var(--tier2);border-color:rgba(156,184,106,.35);background:rgba(156,184,106,.06)">
      <div class="nm">追踪导弹</div>
      <div class="st"><i></i><i class="off"></i><i class="off"></i><i class="off"></i><i class="off"></i></div>
      <div class="pips"><i class="on"></i><i class="on"></i><i></i><em>2/3</em></div>
    </div>
    <div class="slot empty"><div class="nm">空槽</div><div class="st"><i class="off"></i><i class="off"></i><i class="off"></i><i class="off"></i><i class="off"></i></div><div class="pips"><i></i><i></i><i></i><em>0/3</em></div></div>
  </div>

  <div id="skill"><div class="inner"><span class="k">E</span><span class="cd">4.2</span></div></div>
  <div id="stick"><div class="knob"></div></div>
  <div id="hint">WASD / 方向键 · 指针滑移 · P 暂停</div>
</div>

<script>
/* 确定性星空 + 星云：复用游戏里的 mulberry32 思路 */
(function(){
  const cv = document.getElementById('space');
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  function resize(){
    cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
    draw();
  }
  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
  function draw(){
    const w = cv.width, h = cv.height, ctx = cv.getContext('2d');
    ctx.clearRect(0,0,w,h);
    // 深空三段
    const g = ctx.createLinearGradient(0,0,0,h);
    g.addColorStop(0,'#0b0d12'); g.addColorStop(.55,'#08090d'); g.addColorStop(1,'#050608');
    ctx.fillStyle = g; ctx.fillRect(0,0,w,h);
    // 星云带（品牌琥珀，极低 alpha，营造纵深）
    const clouds = [[.28,.30,.62,.10],[.74,.62,.55,.085],[.52,.20,.40,.06]];
    for (const [cx,cy,r,a] of clouds){
      const rg = ctx.createRadialGradient(w*cx,h*cy,0,w*cx,h*cy,Math.max(w,h)*r);
      rg.addColorStop(0,'rgba(216,163,60,'+a+')'); rg.addColorStop(1,'rgba(216,163,60,0)');
      ctx.fillStyle = rg; ctx.fillRect(0,0,w,h);
    }
    // 远景行星弧光（极低 alpha 的巨物感，提供纵深与"我在某颗星球轨道上"的叙事）
    (function(){
      const cx = w*0.10, cy = h*1.06, R = h*0.78;
      const pg = ctx.createRadialGradient(cx,cy,R*0.92,cx,cy,R*1.04);
      pg.addColorStop(0,'rgba(216,163,60,0)'); pg.addColorStop(.55,'rgba(216,163,60,.10)'); pg.addColorStop(1,'rgba(216,163,60,0)');
      ctx.fillStyle = pg; ctx.beginPath(); ctx.arc(cx,cy,R*1.04,0,6.2832); ctx.fill();
      const body = ctx.createRadialGradient(cx-R*0.3,cy-R*0.5,R*0.1,cx,cy,R);
      body.addColorStop(0,'rgba(20,24,30,.92)'); body.addColorStop(1,'rgba(5,6,7,.98)');
      ctx.fillStyle = body; ctx.beginPath(); ctx.arc(cx,cy,R,0,6.2832); ctx.fill();
    })();
    // 星点三层（大小/alpha 分层 = 视差暗示）
    const layers = [[260,0.55,1.0],[420,0.30,1.6],[180,0.75,2.4]];
    let seed = 20260927;
    for (const [n,alpha,size] of layers){
      const rnd = mulberry32(seed++);
      for (let i=0;i<n;i++){
        const x = rnd()*w, y = rnd()*h, s = (0.5+rnd()*0.9)*size*dpr*0.5;
        ctx.globalAlpha = alpha*(0.35+rnd()*0.65);
        ctx.fillStyle = rnd()>0.82 ? '#F2D79B' : '#E2E5E8';
        ctx.beginPath(); ctx.arc(x,y,s,0,6.2832); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }
  addEventListener('resize', resize); resize();
})();
</script>
</body>

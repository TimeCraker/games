services:
  postgres:
    image: postgres:16-alpine
    container_name: game-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: game_dev
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d game_dev"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: game-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  # ===== 新增 Qdrant 向量数据库供 Roo Code 索引使用 =====
  qdrant:
    image: qdrant/qdrant:latest
    container_name: game-qdrant
    ports:
      - "6333:6333" # Roo Code 默认连接的 HTTP 端口
      - "6334:6334" # gRPC 端口
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

volumes:
  pg-data:
  redis-data:
  qdrant-data: # 记得在底部加上这个挂载卷，防止重启丢失索引
  mysql-data: # 旧 MySQL 数据卷:服务定义已移除,历史数据保留不主动删除

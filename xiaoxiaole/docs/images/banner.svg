<svg xmlns="http://www.w3.org/2000/svg" width="780" height="200" viewBox="0 0 780 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1422"/>
      <stop offset="1" stop-color="#1a2240"/>
    </linearGradient>
    <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8a8a"/><stop offset="1" stop-color="#ff6b6b"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5fe3d9"/><stop offset="1" stop-color="#4ecdc4"/></linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe066"/><stop offset="1" stop-color="#ffd93d"/></linearGradient>
    <linearGradient id="g4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bda4ff"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/></filter>
  </defs>
  <rect width="780" height="200" rx="20" fill="url(#bg)"/>
  <!-- 装饰方块 -->
  <g filter="url(#sh)" transform="translate(70,55)">
    <rect width="80" height="80" rx="20" fill="url(#g1)" transform="rotate(-6 40 40)"/>
    <rect x="92" y="-6" width="80" height="80" rx="20" fill="url(#g2)" transform="rotate(5 132 34)"/>
    <rect x="46" y="88" width="80" height="80" rx="20" fill="url(#g3)" transform="rotate(-3 86 128)"/>
    <rect x="138" y="82" width="80" height="80" rx="20" fill="url(#g4)" transform="rotate(7 178 122)"/>
  </g>
  <!-- 标题 -->
  <text x="360" y="98" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="2">桓睿消消乐</text>
  <text x="360" y="132" font-family="'Helvetica Neue',sans-serif" font-size="16" font-weight="700" fill="#5fe3d9" letter-spacing="4">HUANRUI MATCH-3</text>
  <text x="360" y="156" font-family="'PingFang SC',sans-serif" font-size="14" fill="#8b94a8" letter-spacing="1">纯前端 · 零依赖 · 跨平台三消闯关</text>
